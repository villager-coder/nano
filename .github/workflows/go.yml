name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -timeout=120s ./...
      - name: Fuzz packet decoder
        run: go test ./internal/codec -run '^$' -fuzz '^FuzzDecoder$' -fuzztime=10s -parallel=2
      - name: Fuzz message decoder
        run: go test ./internal/message -run '^$' -fuzz '^FuzzDecode$' -fuzztime=10s -parallel=2
